name: Pipeline de Evolucao Segura (CI/CD)

on:
  push:
    tags:
      - 'v*'

jobs:
  sonar:
    name: Quality Gate de Codigo (SonarCloud)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar e rodar testes
        run: mvn -B verify

      - name: Analise SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

  trivy:
    name: Quality Gate de Seguranca (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Trivy - dependencias e codigo
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Build local da imagem (somente para escanear)
        run: docker build -t sistema-reengenheirado:scan .

      - name: Trivy - imagem Docker
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'sistema-reengenheirado:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  build_and_push:
    name: Build e Push para o Docker Hub
    needs: [sonar, trivy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sistema-reengenheirado:${{ github.ref_name }}
